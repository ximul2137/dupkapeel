name: geminienterprise-grupkapeel
services:
  gemini-api:
    build: .
    image: geminienterprise-grupkapeel:local
    container_name: geminienterprise-grupkapeel
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-7860}:7860"
    env_file:
      - .env
    environment:
      # Port wewnątrz kontenera jest stały. PORT w .env zmienia tylko port na komputerze.
      PORT: "7860"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
